name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish the APK as a release

jobs:
  desktop:
    name: Desktop (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libgl1-mesa-dev
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    env:
      QT_SERIES: "6.8"
      NDK_VERSION: 26.1.10909125
      ANDROID_PLATFORM: android-34
      BUILD_TOOLS: 34.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt for Android
        # Qt 6.7+ publishes its Android packages for every host ("all_os"); the desktop Qt
        # is needed too, because the Android build uses its host tools (moc, rcc, ...).
        run: |
          pip install aqtinstall
          QT=$(aqt list-qt all_os android --spec "$QT_SERIES" --latest-version)
          echo "Using Qt $QT"
          aqt install-qt linux desktop "$QT" linux_gcc_64 -O "$RUNNER_TEMP/Qt"
          aqt install-qt all_os android "$QT" android_arm64_v8a -O "$RUNNER_TEMP/Qt"
          echo "QT_ROOT_DIR=$RUNNER_TEMP/Qt/$QT/android_arm64_v8a" >> "$GITHUB_ENV"
          ls "$RUNNER_TEMP/Qt/$QT"

      - name: Install Android NDK and SDK parts
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "platforms;$ANDROID_PLATFORM" "build-tools;$BUILD_TOOLS"

      - name: Configure
        run: |
          HOST_QT=$(ls -d "$QT_ROOT_DIR"/../gcc_64 "$QT_ROOT_DIR"/../linux_gcc_64 2>/dev/null | head -1)
          echo "Desktop Qt (host tools): $HOST_QT"
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$(realpath "$HOST_QT")" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"

      - name: Build APK
        run: cmake --build build-android --target apk --parallel

      - name: Sign APK
        # A throw-away key is enough to install the app on your own phone.
        # (Each build gets a new key, so uninstall the old version before installing a new one.)
        run: |
          UNSIGNED=$(find build-android -name "*.apk" -path "*outputs/apk*" | head -1)
          echo "Unsigned APK: $UNSIGNED"
          TOOLS="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS"
          keytool -genkeypair -keystore ci.keystore -storepass vlaggenspel -keypass vlaggenspel \
            -alias vlaggenspel -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Vlaggenspel"
          "$TOOLS/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$TOOLS/apksigner" sign --ks ci.keystore --ks-pass pass:vlaggenspel --ks-key-alias vlaggenspel \
            --out vlaggenspel.apk aligned.apk
          "$TOOLS/apksigner" verify vlaggenspel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vlaggenspel-android
          path: vlaggenspel.apk

      # A release gives a plain download link that works on a phone without logging in:
      # https://github.com/jmartens90/vlaggenspel/releases/latest/download/vlaggenspel.apk
      - name: Publish APK as the latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" vlaggenspel.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Vlaggenspel (build ${{ github.run_number }})" \
            --notes "Android app. On your phone, tap vlaggenspel.apk below to download it, then open it to install. Uninstall an older version first." \
            --latest
