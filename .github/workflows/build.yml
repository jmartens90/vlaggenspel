name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libgl1-mesa-dev
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    env:
      QT_VERSION: 6.8.3
      NDK_VERSION: 26.1.10909125
      ANDROID_PLATFORM: android-34
      BUILD_TOOLS: 34.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          autodesktop: true
          cache: true

      - name: Install Android NDK and SDK parts
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "platforms;$ANDROID_PLATFORM" "build-tools;$BUILD_TOOLS"

      - name: Configure
        run: |
          HOST_QT=$(ls -d "$QT_ROOT_DIR"/../gcc_64 "$QT_ROOT_DIR"/../linux_gcc_64 2>/dev/null | head -1)
          echo "Desktop Qt (host tools): $HOST_QT"
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$(realpath "$HOST_QT")" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"

      - name: Build APK
        run: cmake --build build-android --target apk --parallel

      - name: Sign APK
        # A throw-away key is enough to install the app on your own phone.
        # (Each build gets a new key, so uninstall the old version before installing a new one.)
        run: |
          UNSIGNED=$(find build-android -name "*.apk" -path "*outputs/apk*" | head -1)
          echo "Unsigned APK: $UNSIGNED"
          TOOLS="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS"
          keytool -genkeypair -keystore ci.keystore -storepass vlaggenspel -keypass vlaggenspel \
            -alias vlaggenspel -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Vlaggenspel"
          "$TOOLS/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$TOOLS/apksigner" sign --ks ci.keystore --ks-pass pass:vlaggenspel --ks-key-alias vlaggenspel \
            --out vlaggenspel.apk aligned.apk
          "$TOOLS/apksigner" verify vlaggenspel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vlaggenspel-android
          path: vlaggenspel.apk
